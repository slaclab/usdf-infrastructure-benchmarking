[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ibench-storage"
version = "0.1.0"
description = "Read benchmarks over warp (S3) and fio (POSIX), mixed-load interference, MLPerf Storage wrapper."
requires-python = ">=3.11"
dependencies = ["ibench-common", "boto3", "pyyaml", "zstandard", "tokenizers"]

[project.optional-dependencies]
hats = ["lsdb==0.10.4", "hats==0.10.4", "nested-pandas", "universal-pathlib", "s3fs", "pyarrow", "pandas"]

[project.scripts]
ibench-storage = "ibench_storage.cli:main"

[tool.uv.sources]
ibench-common = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/ibench_storage"]
