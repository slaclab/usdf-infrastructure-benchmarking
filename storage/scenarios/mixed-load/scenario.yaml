description: Sustained large reads and small latency-sensitive reads on the same endpoint, alone and together.
mix:
  sequential:   # sustained large-object reads
    test: bulk
    prefix: "${IBENCH_S3_PREFIX}"
    concurrency: 32
    max_objects: 200
    max_gb: 50
    duration_s: 120
  small:        # latency-sensitive small reads
    test: latency
    prefix: "${IBENCH_S3_PREFIX}"
    size: 65536
    concurrency: 8
    max_objects: 500
    duration_s: 120
