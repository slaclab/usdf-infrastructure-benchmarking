[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ibench-network"
version = "0.1.0"
description = "iperf3 and path benchmarks."
requires-python = ">=3.11"
dependencies = ["ibench-common"]

[project.scripts]
ibench-net = "ibench_net.cli:main"

[tool.uv.sources]
ibench-common = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/ibench_net"]
