[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ibench-report"
version = "0.1.0"
description = "Consolidate results into history.csv and latest.md."
requires-python = ">=3.11"
dependencies = ["ibench-common"]

[project.optional-dependencies]
plots = ["matplotlib"]

[project.scripts]
ibench-report = "ibench_report.cli:main"

[tool.uv.sources]
ibench-common = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/ibench_report"]
